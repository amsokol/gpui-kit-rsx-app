# markdownlint-cli2 config (https://github.com/DavidAnson/markdownlint-cli2)
config:
  default: true
  # Tables and long URLs wrap poorly.
  MD013: false
  # Allow HTML in docs when needed.
  MD033: false
  # Headings may repeat under different parents.
  MD024:
    siblings_only: true
  # Allow compact table separator rows (`|---|---|`).
  MD060: false

globs:
  - "**/*.md"

ignores:
  # Unmodified copies of the GPUI Kit skills (CLAUDE.md, "Skills").
  - ".claude/skills/**"
  # Patched copies of dependencies (CLAUDE.md, "Patched dependency").
  - "vendor/**"
  - "target/**"
